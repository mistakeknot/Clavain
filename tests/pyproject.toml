[project]
name = "clavain-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pytest>=8.0", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["structural"]
pythonpath = ["structural", "../scripts"]
markers = [
    "requires_ic: needs the `ic` binary on PATH. Deselected with an explanation when it is absent; --require-ic turns that absence into an error (Sylveste-psey).",
]
