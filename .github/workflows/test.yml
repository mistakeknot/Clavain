name: Plugin Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"  # Daily smoke tests at 6am UTC
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run smoke tests (requires ANTHROPIC_API_KEY)"
        type: boolean
        default: false

jobs:
  structural-and-shell:
    runs-on: ubuntu-latest
    # 15, not 5 (Sylveste-psey). The last run that reached Tier 2 used 268 of
    # the 300 seconds this cap allowed, at 830 cases; there are 876 now, so the
    # old ceiling had 32 seconds of headroom and no longer holds. Nothing else
    # about this job's dependencies changes.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: os/Clavain
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          path: os/Clavain

      - name: Check out the verified task profiler dependency
        uses: actions/checkout@v4
        with:
          repository: mistakeknot/interstat
          ref: ede848c682f0e7e8a3787169b944d8f73229e6dc
          path: interverse/interstat

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install bats-core and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: Install bats helpers
        run: npm install -g bats-support bats-assert

      - name: Tier 0 — Shell lint (shellcheck)
        run: |
          # Lint entry-point scripts (set -euo pipefail required)
          # Sourced libraries are excluded — they deliberately omit strict mode
          find hooks/ -maxdepth 1 -name '*.sh' ! -name 'lib-*' ! -name 'lib.sh' -print0 \
            | xargs -0 shellcheck --severity=warning --shell=bash || true
          find scripts/ -maxdepth 1 -name '*.sh' ! -name 'lib-*' -print0 \
            | xargs -0 shellcheck --severity=warning --shell=bash || true

      - name: Tier 1 — Structural tests (pytest)
        run: cd tests && uv run pytest structural/ -v --tb=short

      - name: Task attribution and fixed worker regressions
        run: cd tests && uv run pytest test_task_delivery.py test_flere_worker.py -v --tb=short

      - name: Tier 2 — Shell tests (bats)
        run: |
          # Capture the suite's exit status DIRECTLY. `bats ... | tail` reports
          # the pipe's status, which is how a red suite reads as green
          # (Sylveste-uo7b); and `ok N ... # skip` is an omission, not a pass,
          # so the counts come from the summarizer rather than from eyeballing
          # the last surviving line.
          tap_file="$RUNNER_TEMP/clavain-shell.tap"
          summary_file="$RUNNER_TEMP/clavain-shell-summary.json"
          suite_rc=0
          bats tests/shell/ --recursive --tap > "$tap_file" 2>&1 || suite_rc=$?
          cat "$tap_file"
          report_rc=0
          python3 scripts/suite-report.py --format tap --input "$tap_file" \
            --exit-code "$suite_rc" \
            --actions-skip-baseline tests/fixtures/shell-skip-baselines.json \
            --output-json "$summary_file" || report_rc=$?
          if [ "$report_rc" -eq 3 ]; then
            echo "::warning::Shell coverage changed against run 34150176247; see the delta above."
          elif [ "$report_rc" -ne 0 ]; then
            exit 1
          fi

  smoke:
    if: >-
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Smoke tests via Claude Code
        if: env.HAS_KEY == 'true'
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: tests/smoke/smoke-prompt.md
          max_turns: 40
