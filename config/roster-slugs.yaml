# mk-rpnv.9 P1 — closed-world (model, effort) -> interrank/AgMoDB snapshot
# slug registry (A1, CHECK-M1-r3 A1 fix). See PLAN-M1-r5.md §P1 Identity.
#
# Every row here is hand-verified against the pinned snapshot
# (thread-storage/thr_ttex5g4ker/agmodb-snapshot-ff3f250-20260923T122044Z.json,
# sha256 510dfcc8...2f2bad). The generator (scripts/roster/generate.py) still
# re-checks each row's slug against that snapshot's own parsed effort and
# reasoning mode at run time; it never trusts this file alone.
#
# Deliberately absent: kimi-code/k3 at "high" (used by routing.yaml's
# validation-kimi and crosslab-fable fallback). The pinned snapshot has only
# an effort-unlabelled row (`kimi-k3`) and a `kimi-k3-low` row -- no row
# explicitly labelled high-effort Kimi K3 exists. Per the closed-world rule
# below, an effort-unlabelled row never satisfies a labelled-effort lookup,
# so this triple stays unmapped and the generator refuses rather than
# guessing. This is the plan's own worked example (§P1 Identity), realized
# in the real pinned snapshot -- not a bug in this registry.
#
# Excluded row shapes (never mapped, whatever they superficially resemble):
#   - "-latest" floating aliases (openai-gpt-astra-latest, ...)
#   - composite rows (claude-fable-5-opus-5-fallback)
#   - provider-prefixed pricing-only duplicates (openai-gpt-5-6-sol next to
#     gpt-5-6-sol)
#   - wrong-effort or wrong-reasoning-mode rows, even when the model name
#     matches (claude-sonnet-5-non-reasoning never satisfies a plain
#     (sonnet-5, high) lookup)
#   - effort-unlabelled rows standing in for any labelled effort
rows:
  - model: claude-opus-5
    effort: high
    reasoning_mode: reasoning
    slug: claude-opus-5-high
  - model: claude-sonnet-5
    effort: high
    reasoning_mode: reasoning
    slug: claude-sonnet-5-high
  - model: claude-sonnet-5
    effort: medium
    reasoning_mode: reasoning
    slug: claude-sonnet-5-medium
  - model: claude-fable-5-1
    effort: high
    reasoning_mode: reasoning
    slug: claude-fable-5-1-high
  - model: gpt-5.6-sol
    effort: high
    reasoning_mode: reasoning
    slug: gpt-5-6-sol-high
  - model: gpt-5.6-sol
    effort: medium
    reasoning_mode: reasoning
    slug: gpt-5-6-sol-medium
  - model: gpt-5.6-sol
    effort: xhigh
    reasoning_mode: reasoning
    slug: gpt-5-6-sol-xhigh
  - model: gpt-6-astra
    effort: high
    reasoning_mode: reasoning
    slug: gpt-6-astra-high
  - model: gpt-6-astra
    effort: xhigh
    reasoning_mode: reasoning
    slug: gpt-6-astra-xhigh
