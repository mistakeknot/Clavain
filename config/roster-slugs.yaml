#   - RATIFIED needs `approved_by` and `approval` (a pointer to the record of
#     the decision). Only mk ratifies.
#   - PROPOSED carries no approver. It maps for this run but is listed in
#     report.md under "Waivers pending mk", and P1 is not accepted until mk
#     ratifies it. Every waiver below except Kimi is PROPOSED: mk has not
#     ratified them (REVIEW-P1-r2 assessed them; mk's labels applied
