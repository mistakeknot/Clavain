# mk-rpnv.9 P1 — closed-world reference -> interrank/AgMoDB snapshot row
# registry (A1, CHECK-M1-r3 A1 fix). See PLAN-M1-r5.md §P1 Identity.
#
# STRICT (mk, 2026-09-25): every model string routing.yaml references must be
# mapped here, by a `rows` entry or a `waivers` entry, before the generator
# emits a patch. That covers dispatch tiers, model aliases, frontier_models,
# subagent/complexity model aliases and local models. Executor names in
# executor_routing are backends and resolve through the dispatch tiers that
# use that backend. Anything unmapped is a refusal.
#
# The generator never trusts this file alone. For every row and waiver it
# re-parses the target snapshot row and requires:
#   - the row's base name to equal roster-families.yaml `snapshot_name` for
#     `model` (identity, B4);
#   - parsed effort and reasoning mode to equal the declared ones exactly;
#   - no `-latest` alias, composite ("<X> Fallback" other than Default),
#     provider-prefixed duplicate, or unrecognised qualifier ("batch",
#     "free", "Fast", "Pro").
# Pinned snapshot: rpnv9/evidence/agmodb-snapshot-ff3f250-20260923T122044Z.json
# (sha256 510dfcc8...2f2bad).
#
# `rows` are exact matches. A tier row is keyed by (model, effort). A row with
# `ref` binds a non-tier reference (local model) whose routing.yaml entry
# declares its mode; its declared effort/mode are still re-checked.
rows:
  - model: claude-opus-5
    effort: high
    reasoning_mode: reasoning
    slug: claude-opus-5-high
  - model: claude-sonnet-5
    effort: high
    reasoning_mode: reasoning
    slug: claude-sonnet-5-high
  - model: claude-sonnet-5
    effort: medium
    reasoning_mode: reasoning
    slug: claude-sonnet-5-medium
  - model: claude-fable-5-1
    effort: high
    reasoning_mode: reasoning
    slug: claude-fable-5-1-high
  - model: gpt-5.6-sol
    effort: high
    reasoning_mode: reasoning
    slug: gpt-5-6-sol-high
  - model: gpt-5.6-sol
    effort: medium
    reasoning_mode: reasoning
    slug: gpt-5-6-sol-medium
  - model: gpt-5.6-sol
    effort: xhigh
    reasoning_mode: reasoning
    slug: gpt-5-6-sol-xhigh
  - model: gpt-6-astra
    effort: high
    reasoning_mode: reasoning
    slug: gpt-6-astra-high
  - model: gpt-6-astra
    effort: xhigh
    reasoning_mode: reasoning
    slug: gpt-6-astra-xhigh
  # Local models whose routing.yaml entry fixes the mode.
  - ref: "local:qwen3.6-35b-a3b-4bit"
    model: qwen3.6-35b-a3b
    effort: null
    reasoning_mode: non-reasoning
    slug: qwen3-6-35b-a3b-non-reasoning
    evidence: routing.yaml tier_mappings comment "enable_thinking=False" and "Thinking mode hurts ...; keep off"
  - ref: "local:nemotron-30b-a3b-8bit"
    model: nemotron-cascade-2-30b-a3b
    effort: null
    reasoning_mode: unlabelled
    slug: nemotron-cascade-2-30b-a3b
    evidence: routing.yaml comment names mlx-community/Nemotron-Cascade-2-30B-A3B-8bit; the snapshot has one unqualified row

# Waivers bind a reference whose snapshot evidence does not match exactly.
# `row_effort` / `row_reasoning_mode` describe the snapshot row as parsed (not
# the seat), so the generator still verifies the row is what the waiver says
# it is. `status` RATIFIED rows are mk decisions; PROPOSED rows are mapped for
# this run but listed in report.md under "Waivers pending mk", and P1 is not
# accepted until mk ratifies them.
waivers:
  - ref: "kimi-code/k3@high"
    model: kimi-code/k3
    slug: kimi-k3
    row_effort: null
    row_reasoning_mode: unlabelled
    status: RATIFIED (mk waiver, 2026-09-25)
    label: "max-effort evidence standing in for high; upper bound"
    evidence:
      - "Moonshot Kimi API quickstart (platform.kimi.ai/docs/guide/kimi-k3-quickstart): reasoning effort low/high/max, default max"
      - "Artificial Analysis artificialanalysis.ai/models/kimi-k3 is headed \"Kimi K3 (max)\""
      - "The snapshot has only kimi-k3 (unlabelled) and kimi-k3-low; no high row"
  - ref: "subagent:sonnet"
    model: claude-sonnet-5
    slug: claude-sonnet-5-xhigh
    row_effort: xhigh
    row_reasoning_mode: reasoning
    status: PROPOSED (mk to ratify)
    evidence:
      - "Claude Code built-in alias `sonnet` resolves to the latest Sonnet (claude-sonnet-5); subagents carry no effort field"
      - "Claude Code 2.1.282 on this host: ~/.claude/settings.json:717 effortLevel \"xhigh\""
